spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/workoutplanner
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migration: true

server:
  port: 8080